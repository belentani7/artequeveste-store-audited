name: CI (pnpm)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.22.2 is the floor jsdom 30 declares; 24 is the current LTS.
        node: [22, 24]
    name: verify (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4

      # Node first: `cache: pnpm` would need pnpm on PATH before this action
      # runs, so the pnpm store is cached explicitly in the step below.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable corepack (pnpm version comes from packageManager)
        run: corepack enable

      - name: Resolve the pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Formatting (code surface only; see .prettierignore)
        run: pnpm format:check

      - name: TypeScript
        run: pnpm check

      - name: Unit and integration tests
        run: pnpm test
        env:
          # The live Shopify smoke test skips itself when these are absent.
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_STOREFRONT_API_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_API_ACCESS_TOKEN }}

      - name: Cart session regressions (storage denied, rapid adds)
        run: pnpm test:cart-session

      - name: Build client and server
        run: pnpm build

      - name: Smoke the production server
        run: |
          set -euo pipefail
          # NODE_ENV=production is the whole point of this step: it is the only
          # path that exercises serveStatic + the strict CSP.
          NODE_ENV=production PORT=3100 node dist/index.js > /tmp/aqv-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3100/api/health > /tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::production server never became ready"
            cat /tmp/aqv-server.log
            exit 1
          fi

          cat /tmp/health.json; echo
          node -e "
            const fs = require('node:fs');
            const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
            if (!health.ok) throw new Error('health not ok: ' + JSON.stringify(health));
            if (health.environment !== 'production') throw new Error('not production mode: ' + health.environment);
          "
          curl -sf http://127.0.0.1:3100/ | grep -qi "arte que veste"
          curl -sf -o /dev/null http://127.0.0.1:3100/produto/deep-link-desconhecido
          curl -sf -o /dev/null http://127.0.0.1:3100/robots.txt
          echo "production smoke ok"
