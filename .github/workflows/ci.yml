name: CI (pnpm)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.22.2 is the floor jsdom 30 declares; 24 is the current LTS.
        node: [22, 24]
    name: verify (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4

      # Node first: `cache: pnpm` would need pnpm on PATH before this action
      # runs, so the pnpm store is cached explicitly in the step below.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable corepack (pnpm version comes from packageManager)
        run: corepack enable

      - name: Resolve the pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Formatting (code surface only; see .prettierignore)
        run: pnpm format:check

      - name: TypeScript
        run: pnpm check

      - name: Unit and integration tests
        run: pnpm test
        env:
          # The live Shopify smoke test skips itself when these are absent.
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_STOREFRONT_API_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_API_ACCESS_TOKEN }}

      - name: Build client and server
        run: pnpm build

      - name: Smoke the production server
        run: |
          PORT=3100 node dist/index.js &
          SERVER_PID=$!
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:3100/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3100/api/health | tee /tmp/health.json
          node -e "const h = require('/tmp/health.json'); if (!h.ok) { console.error('health not ok', h); process.exit(1) }"
          curl -sf http://127.0.0.1:3100/ | grep -qi "arte que veste"
          curl -sf -o /dev/null http://127.0.0.1:3100/produto/deep-link-desconhecido
          kill "$SERVER_PID"
