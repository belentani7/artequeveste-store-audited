name: CI (pnpm)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: corepack enable
      # Reads the exact version from package.json#packageManager.
      - run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm check

      - name: Unit and integration tests
        run: pnpm test
        env:
          # The live Shopify smoke test skips itself when these are absent.
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_STOREFRONT_API_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_API_ACCESS_TOKEN }}

      - name: Build client and server
        run: pnpm build

      - name: Smoke the production server
        run: |
          PORT=3100 node dist/index.js &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3100/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3100/api/health | tee /tmp/health.json
          curl -sf http://127.0.0.1:3100/ | grep -q "ARTE QUE VESTE" || curl -sf http://127.0.0.1:3100/ | grep -q "art"
          curl -sf -o /dev/null http://127.0.0.1:3100/produto/deep-link-desconhecido
          node -e "const h=require('/tmp/health.json'); if(!h.ok) process.exit(1)"
          kill %1
